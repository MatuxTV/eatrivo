<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eatrivo Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --accent: #8b5cf6;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #ede9fe, var(--bg) 45%);
        color: var(--text);
        font-family: Quicksand, Arial, sans-serif;
      }

      .card {
        width: min(100%, 480px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 18px 50px rgba(17, 24, 39, 0.08);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent);
        font-size: 30px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">R</div>
      <h1>You are offline</h1>
      <p>Eatrivo cannot reach the internet right now.</p>
      <p>Your app will reconnect automatically when the network is back.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
